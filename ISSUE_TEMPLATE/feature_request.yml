name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could VloomDAW help? Screenshots from other software are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you have tried
